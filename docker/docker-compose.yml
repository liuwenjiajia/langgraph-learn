# 本地向量库 / 全文检索的开发环境
#   milvus        —— Standalone 模式 + 内嵌 etcd + 本地存储（单容器，最接近 Milvus Lite 的 Docker 形态）
#   elasticsearch —— 单节点，关闭 security，可直接 http 裸连
#   attu / kibana —— 可选 Web 控制台，用 `--profile ui` 才启动
#
# 仅供本地开发：两个服务都没有开启鉴权，不要暴露到公网。
name: langgraph-store

services:
  milvus:
    image: milvusdb/milvus:${MILVUS_VERSION:-v2.6.23}
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      # 用内嵌 etcd + 本地磁盘，省掉独立的 etcd 和 MinIO 容器
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      # v2.6 起必需，否则 Milvus 会按 distributed 模式判定并 panic
      DEPLOY_MODE: STANDALONE
    volumes:
      - milvus-data:/var/lib/milvus
      - ./milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./milvus/user.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "${MILVUS_PORT:-19530}:19530"   # gRPC / SDK
      - "${MILVUS_WEB_PORT:-9091}:9091" # 健康检查 + WebUI (/webui)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 20s
      retries: 8
      start_period: 90s
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:${ES_VERSION:-8.19.21}
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: "-Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}"
      # VM 里 mlockall 容易触发启动自检失败，本地开发直接关掉
      bootstrap.memory_lock: "false"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # ---- 可选：docker compose --profile ui up -d ----
  attu:
    image: zilliz/attu:${ATTU_VERSION:-v2.6}
    container_name: milvus-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "${ATTU_PORT:-8000}:3000"
    depends_on:
      milvus:
        condition: service_healthy
    profiles: ["ui"]
    restart: unless-stopped

  kibana:
    image: kibana:${ES_VERSION:-8.19.21}
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    profiles: ["ui"]
    restart: unless-stopped

volumes:
  milvus-data:
  es-data:
