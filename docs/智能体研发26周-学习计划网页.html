<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>智能体研发 26 周</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* 布局：概览数字 → 今日任务 → 阶段状态图与打卡日历 → 标签页（逐日计划 / 各阶段 / JD / 节奏）。
     冷灰纸面 + 钴蓝强调；绿 = 已完成，琥珀 = 进行中 / 推迟。 */
  :root {
    --bg: #F2F3EF;
    --surface: #FFFFFF;
    --surface-2: #E8EAE4;
    --ink: #1A1D21;
    --ink-2: #4B535C;
    --ink-3: #7B838C;
    --line: #D3D7CF;
    --line-strong: #B9BEB5;
    --accent: #1F4FD8;
    --accent-ink: #FFFFFF;
    --accent-soft: #E3E9FB;
    --done: #178A55;
    --done-soft: #DDF3E7;
    --active: #C7780C;
    --active-soft: #FBEBD1;
    --todo: #9AA1A9;
    --todo-soft: #ECEEEA;
    --shadow: 0 1px 2px rgba(20, 24, 28, .06), 0 6px 20px -12px rgba(20, 24, 28, .18);
    --radius: 10px;
    --font-body: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --font-mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181C;
      --surface: #1D2126;
      --surface-2: #262B31;
      --ink: #E8EAE6;
      --ink-2: #B4BAB6;
      --ink-3: #858C91;
      --line: #343A41;
      --line-strong: #454C54;
      --accent: #85A3FF;
      --accent-ink: #0F1A3A;
      --accent-soft: #24304F;
      --done: #4FC48A;
      --done-soft: #1B3A2B;
      --active: #E9A23B;
      --active-soft: #3D2E14;
      --todo: #6C737A;
      --todo-soft: #2A2F35;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181C;
    --surface: #1D2126;
    --surface-2: #262B31;
    --ink: #E8EAE6;
    --ink-2: #B4BAB6;
    --ink-3: #858C91;
    --line: #343A41;
    --line-strong: #454C54;
    --accent: #85A3FF;
    --accent-ink: #0F1A3A;
    --accent-soft: #24304F;
    --done: #4FC48A;
    --done-soft: #1B3A2B;
    --active: #E9A23B;
    --active-soft: #3D2E14;
    --todo: #6C737A;
    --todo-soft: #2A2F35;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  code { font-family: var(--font-mono); font-size: .86em; background: var(--surface-2); color: var(--ink); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .page { max-width: 1240px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  @media (max-width: 640px) { .page { padding-block: 18px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

  /* ---------- header ---------- */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--line-strong); }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.2; margin: 0; letter-spacing: .01em; text-wrap: balance; }
  .sub { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; max-width: 80ch; }
  .sub b { font-weight: 500; color: var(--ink); }
  .save { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 10px; }
  .save .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--todo); }
  .save[data-mode="cloud"] .dot { background: var(--done); }
  .save[data-mode="local"] .dot { background: var(--active); }
  .save[data-mode="saving"] .dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---------- stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 12px; min-width: 0; }
  .stat .k { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
  .stat .v { font-family: var(--font-mono); font-size: 26px; font-weight: 500; line-height: 1.1; margin: 0; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .stat .v small { font-size: 13px; color: var(--ink-3); font-weight: 400; }
  .stat .v.ahead { color: var(--done); }
  .stat .v.behind { color: var(--active); }
  .stat .d { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .35s ease; }
  .bar.done i { background: var(--done); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1; padding: 5px 8px; border-radius: 999px; background: var(--todo-soft); color: var(--ink-2); white-space: nowrap; }
  .pill.done { background: var(--done-soft); color: var(--done); }
  .pill.active { background: var(--active-soft); color: var(--active); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }
  .pill.ahead { background: var(--done-soft); color: var(--done); }
  .pill.behind { background: var(--active-soft); color: var(--active); }
  .pill.solid { background: var(--accent); color: var(--accent-ink); }

  /* ---------- today ---------- */
  .today { margin-top: 20px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow); }
  .today-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 18px; padding: 16px 18px 14px; border-bottom: 1px solid var(--line); }
  .today-head > div:first-child { min-width: 0; }
  .today-head .when { margin: 0; font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; color: var(--ink-3); }
  .today-head h2 { margin: 4px 0 0; font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
  .today-head h2 .code { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--accent); margin-right: 10px; vertical-align: 2px; }
  .today-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .tips { margin: 0; padding: 10px 18px; list-style: none; border-bottom: 1px solid var(--line); background: var(--active-soft); font-size: 13.5px; display: grid; gap: 4px; }
  .tips li::before { content: "提示 · "; font-family: var(--font-mono); font-size: 11.5px; color: var(--active); }
  .today-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); }
  @media (max-width: 880px) { .today-body { grid-template-columns: minmax(0, 1fr); } }
  .today-main { padding: 10px 14px 16px; min-width: 0; }
  .today-side { padding: 14px 18px 16px; border-left: 1px solid var(--line); min-width: 0; display: grid; gap: 16px; align-content: start; }
  @media (max-width: 880px) { .today-side { border-left: 0; border-top: 1px solid var(--line); } }
  .side-k { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
  .meter-v { font-family: var(--font-mono); font-size: 22px; font-weight: 500; line-height: 1.1; display: flex; align-items: baseline; gap: 6px; margin: 0; font-variant-numeric: tabular-nums; }
  .meter-v small { font-size: 12.5px; color: var(--ink-3); font-weight: 400; }
  .legend-line { margin: 6px 4px 0; font-size: 12px; color: var(--ink-3); }
  .rest-note { margin: 8px 4px 12px; color: var(--ink-2); font-size: 14px; max-width: 68ch; }

  /* ---------- tasks ---------- */
  .tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .task { display: grid; grid-template-columns: 20px 52px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 6px 8px 4px; border-radius: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .task:hover { background: var(--surface-2); }
  .task input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--done); cursor: pointer; }
  .task .min { font-family: var(--font-mono); font-size: 12px; line-height: 1.95; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .task.opt .min { color: var(--ink-3); }
  .task .t { font-size: 14px; line-height: 1.6; min-width: 0; }
  .task.opt .t { color: var(--ink-2); }
  .task.checked .t { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  @media (max-width: 640px) { .task { grid-template-columns: 20px 44px minmax(0, 1fr); gap: 6px; } }
  .crit { margin: 10px 4px 0; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; font-size: 13.5px; color: var(--ink-2); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; }
  .crit .k { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .04em; color: var(--done); padding-top: 2px; white-space: nowrap; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 12px 4px 0; font-size: 12.5px; color: var(--ink-3); }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.quiet { background: transparent; border-color: var(--line); color: var(--ink-2); font-weight: 400; }
  .btn.quiet:hover { border-color: var(--line-strong); color: var(--ink); filter: none; }
  .date-in { font: inherit; font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
  .done-list { display: grid; gap: 8px; margin: 6px 4px 14px; }
  .done-row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--done-soft); font-size: 14px; }
  .done-row .ok { color: var(--done); font-weight: 600; }
  .done-row .grow { flex: 1 1 240px; min-width: 0; }
  .done-row label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
  .next { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; display: grid; gap: 8px; }
  .next .nt { font-weight: 600; font-size: 14px; }
  .next .nw { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
  .peek { margin-top: 4px; }

  /* ---------- refs ---------- */
  .refs { display: grid; gap: 7px; }
  .ref { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; line-height: 1.45; min-width: 0; }
  .ref a { font-weight: 500; overflow-wrap: anywhere; }
  .ref.read a { color: var(--ink-3); }
  .ref .chip { flex: none; }
  .ref .rd { font-size: 11.5px; color: var(--done); flex: none; }
  .refs.inline { margin: 12px 4px 0; }

  /* ---------- state graph ---------- */
  .graph { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 16px; box-shadow: var(--shadow); }
  .graph-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .graph-head h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0; }
  .graph-head p { margin: 0; font-size: 13px; color: var(--ink-3); }
  .nodes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; position: relative; }
  .node { position: relative; background: transparent; border: 0; padding: 8px 6px 10px; text-align: center; cursor: pointer; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .node:hover { background: var(--surface-2); }
  .node[aria-pressed="true"] { background: var(--accent-soft); }
  .node + .node::before { content: ""; position: absolute; left: calc(-50% + 30px); right: calc(50% + 30px); top: 36px; height: 2px; background: var(--line-strong); }
  .node[data-status="done"] + .node::before { background: var(--done); }
  .ring { width: 56px; height: 56px; position: relative; display: grid; place-items: center; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .track { fill: none; stroke: var(--surface-2); stroke-width: 5; }
  .ring .fill { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
  .node[data-status="done"] .ring .fill { stroke: var(--done); }
  .node[data-status="todo"] .ring .fill { stroke: var(--todo); }
  .ring b { font-family: var(--font-mono); font-size: 13px; font-weight: 500; position: relative; }
  .node .nm { font-size: 13px; font-weight: 500; line-height: 1.3; color: var(--ink); text-wrap: balance; }
  .node .wk { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
  .node .st { margin-top: 2px; }
  .node .here { position: absolute; top: 2px; right: 6px; font-family: var(--font-mono); font-size: 10.5px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; }
  @media (max-width: 900px) {
    .nodes { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 8px; }
    .node + .node::before { display: none; }
  }
  @media (max-width: 520px) { .nodes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* ---------- check-in calendar ---------- */
  .cal { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .cal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .cal-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .cal-head p { margin: 0; font-size: 12.5px; color: var(--ink-3); }
  .cal-scroll { overflow-x: auto; padding: 4px 2px 6px; }
  .cal-grid { display: grid; grid-template-columns: 18px repeat(var(--cols), minmax(12px, 1fr)); grid-template-rows: 16px repeat(5, 16px) repeat(2, 8px); gap: 3px; min-width: calc(18px + var(--cols) * 15px); }
  .cal-m { grid-row: 1; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; align-self: end; line-height: 1; }
  .cal-w { grid-column: 1; font-size: 10px; line-height: 16px; color: var(--ink-3); }
  .cc { display: block; border: 0; padding: 0; margin: 0; border-radius: 3px; background: var(--todo-soft); min-width: 0; font-size: 0; }
  button.cc { cursor: pointer; }
  button.cc:hover { filter: brightness(.92); }
  .cc.pre { background: transparent; }
  .cc.rest { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
  .cc.hol { background: repeating-linear-gradient(135deg, var(--line-strong) 0 1.5px, transparent 1.5px 4px); }
  .cc.done { background: var(--done); }
  .cc.done2 { background: radial-gradient(circle, var(--surface) 0 2px, var(--done) 2.5px); }
  .cc.covered { background: var(--done-soft); }
  .cc.missed { background: var(--active-soft); box-shadow: inset 0 0 0 1.5px var(--active); }
  .cc.plan { background: var(--accent-soft); }
  .cc.plan.alt { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .cc.free { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
  .cc.today { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--ink-3); }
  .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cal-legend .cc { width: 12px; height: 12px; flex: none; }

  /* ---------- tabs ---------- */
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 26px; border-bottom: 1px solid var(--line-strong); }
  .tab { flex: 0 0 auto; background: transparent; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 10px; cursor: pointer; color: var(--ink-2); font-size: 13.5px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .tab .code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
  .tab[aria-selected="true"] .code { color: var(--accent); }
  .tab .mini { width: 8px; height: 8px; border-radius: 50%; background: var(--todo); }
  .tab .mini.done { background: var(--done); }
  .tab .mini.active { background: var(--active); }
  .tab.lead { padding-right: 12px; margin-right: 4px; border-right: 1px solid var(--line); border-radius: 0; }
  .tab.util { margin-left: 8px; padding-left: 12px; border-left: 1px solid var(--line); border-radius: 0; }
  @media (min-width: 1100px) { .tab.util { margin-left: auto; } }

  /* ---------- daily plan ---------- */
  .panel { margin-top: 22px; }
  .dl-tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .dl-tools .note { font-size: 13px; color: var(--ink-3); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .dl-phase { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
  .dl-phase > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 14px 16px; }
  .dl-phase > summary::-webkit-details-marker { display: none; }
  .dl-phase > summary:hover { background: var(--surface-2); }
  .dl-phase h3 { margin: 0; font-family: var(--font-display); font-size: 17px; font-weight: 600; line-height: 1.35; }
  .dl-phase h3 .code { font-family: var(--font-mono); font-size: 13px; color: var(--accent); margin-right: 8px; font-weight: 500; }
  .pmeta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .chev { width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(-45deg); transition: transform .2s ease; justify-self: center; }
  details[open] > summary .chev { transform: rotate(45deg); }
  .dl-week { padding: 7px 16px 5px 50px; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .03em; color: var(--ink-3); border-top: 1px solid var(--line); background: var(--bg); display: flex; gap: 8px; align-items: center; }
  .dl-week .now { color: var(--accent); }
  .day { border-top: 1px solid var(--line); scroll-margin-top: 80px; }
  .day > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 22px 132px minmax(0, 1fr) auto; grid-template-areas: "st when title meta"; gap: 4px 10px; align-items: center; padding: 10px 16px; }

  const TYPE_ZH = { docs: '文档', course: '课程', article: '文章', paper: '论文', tool: '工具', video: '视频' };
  const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const LS_KEY = 'agent26-progress-v1';

  /* =========================== 日期工具 =========================== */
  function parseDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return d.getMonth() === +m[2] - 1 ? d : null;
  }
  function fmt(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return fmt(d); }

  // 凌晨 4 点前还算前一天：熬夜打卡不会记到第二天
  function todayStr() { return fmt(new Date(Date.now() - 4 * 3600 * 1000)); }

  /* =========================== 计划日期（固定） =========================== */
  const DAYS = [];
  const DAY_BY_ID = {};
  PLAN.phases.forEach(p => (p.days || []).forEach(d => { d.phase = p.id; DAYS.push(d); DAY_BY_ID[d.id] = d; }));
  function isBaseWorkday(s) { const w = dow(s); return w !== 0 && w !== 6 && !HOLIDAYS[s]; }
  const BASE = {};
  const BASE_LIST = [];
  (function () {
    let d = START;
    while (BASE_LIST.length < DAYS.length + 260) { if (isBaseWorkday(d)) BASE_LIST.push(d); d = addDays(d, 1); }
    DAYS.forEach((day, i) => { BASE[day.id] = BASE_LIST[i]; day.n = i + 1; });
  })();
  // 计划工作日里早于 s 的天数
  function bIndex(s) {
    let lo = 0, hi = BASE_LIST.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (BASE_LIST[mid] < s) lo = mid + 1; else hi = mid; }
    return lo;
  }
  PLAN.phases.forEach(p => {
    if (!p.days) return;
    p.from = BASE[p.days[0].id];
    p.to = BASE[p.days[p.days.length - 1].id];
    p.hours = p.days.length * 2;
    const hol = HOLIDAY_GROUPS.map(g => [g[0], g[1].filter(d => d >= p.from && d <= p.to)]).filter(g => g[1].length);
    p.holNote = hol.map(g => g[0] + '（' + (g[1].length > 1 ? mds(g[1][0]) + ' – ' + mds(g[1][g[1].length - 1]) : mds(g[1][0])) + '）').join('、');
  });
  const PLAN_END = BASE[DAYS[DAYS.length - 1].id];

  /* =========================== 状态 =========================== */
  function blankState() { return { done: {}, reviewed: {}, tasks: {}, days: {}, rest: {}, startDate: START, updatedAt: '' }; }
  let state = blankState();
  let dbDoc = null;
  let activeTab = 'daily';

  // 本地版本号：每次用户改动 +1；savedVersion 是云端已确认写入的版本。

  let localVersion = 0;

  function isStudyDay(s) {
    const o = state.rest[s];
    if (o === 'off') return false;

  function nextStudyDay(s) { let d = s; for (let i = 0; i < 400; i++) { d = addDays(d, 1); if (isStudyDay(d)) return d; } return d; }

  /* =========================== 排期（滚动） =========================== */
  // 计划日期固定不变；预计日期 = 从今天（今天已完成一天则从下一个学习日）起，把未完成的任务按顺序排到学习日上。
  function computeCtx() {
    const t = todayStr();
    const doneToday = DAYS.filter(d => state.days[d.id] === t);

    if (t < START) cursor = isStudyDay(START) ? START : nextStudyDay(START);

    DAYS.forEach(day => {

      pending.push(day);

      (projByDate[cursor] = projByDate[cursor] || []).push(day);
      cursor = nextStudyDay(cursor);

    const doneCount = DAYS.length - pending.length;
    let delta = 0;
    if (t >= START) {

      if (doneCount >= expT) delta = doneCount - expT;
      else if (doneCount < expY) delta = doneCount - expY;
    } else delta = doneCount;

    const byDate = {};
    DAYS.forEach(d => { const c = state.days[d.id]; if (c) (byDate[c] = byDate[c] || []).push(d); });
    const doneDates = DAYS.map(d => state.days[d.id]).filter(Boolean).sort();
    // 过去的学习日：已打卡 / 没打卡但不落后 / 缺卡
    const pastState = {};
    let missed = 0, j = 0, cum = 0;
    for (let d = START; d < t; d = addDays(d, 1)) {
      while (j < doneDates.length && doneDates[j] <= d) { cum++; j++; }
      if (byDate[d]) { pastState[d] = 'done'; continue; }
      if (!isStudyDay(d)) { pastState[d] = 'rest'; continue; }
      const exp = bIndex(d) + (isBaseWorkday(d) ? 1 : 0);
      if (cum >= exp) pastState[d] = 'covered'; else { pastState[d] = 'missed'; missed++; }
    }
    let streak = 0;
    for (let d = t, i = 0; d >= START && i < 800; d = addDays(d, -1), i++) {
      if (byDate[d]) { streak++; continue; }
      if (d === t) continue;
      if (isStudyDay(d)) break;
    }
    const mon = mondayOf(t), sun = addDays(mon, 6);
    const weekDone = doneDates.filter(d => d >= mon && d <= sun).length;
    const next = pending[0] || null;
    let mode;
    if (!next) mode = 'finished';
    else if (doneToday.length) mode = 'done';
    else if (t >= START && isStudyDay(t)) mode = 'todo';
    else mode = 'rest';
    const endDate = next ? proj[pending[pending.length - 1].id] : (doneDates[doneDates.length - 1] || PLAN_END);
    return { t, proj, pending, projByDate, doneToday, doneCount, delta, byDate, pastState, missed, streak, weekDone, checkins: Object.keys(byDate).length, focus: { mode, day: next }, endDate };
  }
  function effDate(day, ctx) { return state.days[day.id] || ctx.proj[day.id]; }
  function dayDelta(day, ctx) { return bIndex(effDate(day, ctx)) - (day.n - 1); }

  /* =========================== 阶段状态 =========================== */
  function ids(p) {
    const out = [];
    p.topics.forEach((_, i) => out.push(p.id + '.t' + i));
    p.deliverables.forEach((_, i) => out.push(p.id + '.d' + i));
    p.resources.forEach((_, i) => out.push(p.id + '.r' + i));
    p.videos.forEach((_, i) => out.push(p.id + '.v' + i));

  function progress(p) {
    const all = ids(p);
    const done = all.filter(id => state.done[id]).length;
    return { done, total: all.length, pct: all.length ? done / all.length : 0 };

  }
  function dayProgress(p) {
    const ds = p.days || [];
    const done = ds.filter(d => state.days[d.id]).length;
    return { done, total: ds.length, pct: ds.length ? done / ds.length : 0 };
  }

      if (dp.done === dp.total) return 'done';
      if (dp.done > 0 || p.days.some(d => doneMinutes(d) > 0) || progress(p).done > 0) return 'active';
      return 'todo';
    }
    const pr = progress(p);
    if (pr.total && pr.done === pr.total) return 'done';
    return pr.done > 0 ? 'active' : 'todo';
  }
  function ringPct(p) { return p.closed ? 1 : p.days ? dayProgress(p).pct : progress(p).pct; }
  function currentPhase() { return PLAN.phases.find(p => statusOf(p) !== 'done') || PLAN.phases[PLAN.phases.length - 1]; }
  function expectedPhase(t) {

  /* =========================== 文本与小组件 =========================== */
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function rich(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }

    return `<ul class="tasks">${day.k.map((k, i) => {
      const id = day.id + '.' + i; const on = !!state.tasks[id]; const opt = !!k[2];
      return `<li><label class="task${opt ? ' opt' : ''}${on ? ' checked' : ''}"><input type="checkbox" data-task="${id}"${on ? ' checked' : ''}><span class="min">${opt ? '☆' : '★'} ${k[0]}′</span><span class="t">${rich(k[1])}</span></label></li>`;
    }).join('')}</ul>`;
  }
  function critHtml(day) { return `<div class="crit"><span class="k">完成标准</span><span>${rich(day.ok)}</span></div>`; }
  function phaseLabel(p) { return p.code + ' ' + p.short; }

  /* =========================== 持久化 =========================== */
  function normalize(d) {
    const n = blankState();
    if (!d || typeof d !== 'object') return n;
    if (d.done && typeof d.done === 'object') Object.keys(d.done).forEach(k => { if (d.done[k]) n.done[k] = true; });
    if (d.tasks && typeof d.tasks === 'object') Object.keys(d.tasks).forEach(k => { if (d.tasks[k]) n.tasks[k] = true; });
    if (d.reviewed && typeof d.reviewed === 'object') Object.keys(d.reviewed).forEach(k => { if (typeof d.reviewed[k] === 'string') n.reviewed[k] = d.reviewed[k]; });
    if (d.days && typeof d.days === 'object') Object.keys(d.days).forEach(k => { if (parseDate(d.days[k])) n.days[k] = d.days[k]; });
    if (d.rest && typeof d.rest === 'object') Object.keys(d.rest).forEach(k => { if (parseDate(k) && (d.rest[k] === 'on' || d.rest[k] === 'off')) n.rest[k] = d.rest[k]; });
    if (typeof d.startDate === 'string' && parseDate(d.startDate)) n.startDate = d.startDate;
    if (typeof d.updatedAt === 'string') n.updatedAt = d.updatedAt;
    return n;
  }
  function serialize() {
    return { done: Object.assign({}, state.done), tasks: Object.assign({}, state.tasks), days: Object.assign({}, state.days), rest: Object.assign({}, state.rest), reviewed: Object.assign({}, state.reviewed), startDate: state.startDate, updatedAt: state.updatedAt || '' };
  }
  function canon(o) {
    if (o && typeof o === 'object' && !Array.isArray(o)) { const r = {}; Object.keys(o).sort().forEach(k => { r[k] = canon(o[k]); }); return r; }
    return o;
  }
  function contentKey(s) { return JSON.stringify(canon({ d: s.done, t: s.tasks, y: s.days, s: s.rest, r: s.reviewed })); }
  function sameContent(a, b) { return contentKey(a) === contentKey(b); }
  function loadLocal() {
    try { const raw = localStorage.getItem(LS_KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) { /* storage unavailable */ }
    return null;
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(serialize())); } catch (e) { /* storage unavailable */ }
  }
  function setSaveMode(mode, text) {
    const el = document.getElementById('save');
    el.dataset.mode = mode;
    document.getElementById('saveText').textContent = text;
  }
  // 每次用户改动都经过这里：先落本机，再尽快写云端。
  function touch() {
    state.updatedAt = new Date().toISOString();
    localVersion++;
    saveLocal();
    if (!dbDoc) { setSaveMode('local', 'Checkpoint · 已保存在本机'); return; }
    setSaveMode('saving', 'Checkpoint · 保存中');
    clearTimeout(writeTimer);
    writeTimer = setTimeout(flush, 120); // 只为合并连点，不再长时间延迟
  }
  function flush() {
    if (!dbDoc || writing) return;
    if (localVersion === savedVersion) { setSaveMode('cloud', 'Checkpoint · 已同步到云端'); return; }
    const v = localVersion;
    writing = true;
    dbDoc.set(serialize()).then(() => {
      writing = false; writeFailures = 0; savedVersion = v;
      if (localVersion !== savedVersion) flush(); // 写入期间又有改动，接着写
      else setSaveMode('cloud', 'Checkpoint · 已同步到云端');
    }).catch(() => {
      writing = false; writeFailures++;
      if (writeFailures >= 3) {
        dbDoc = null;
        setSaveMode('local', 'Checkpoint · 云端不可用，已保存在本机');
        return;
      }
      setSaveMode('saving', 'Checkpoint · 云端暂不可用，稍后重试');
      setTimeout(flush, 2500);
    });
  }
  async function initDb() {
    let db = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db');
    } catch (e) { db = null; }
    if (!db) {
      setSaveMode('local', 'Checkpoint · 保存在本机');
      document.getElementById('footNote').textContent = '当前进度保存在这台设备的浏览器里；在 claude.ai 里打开可同步到云端。';
      return;
    }
    dbDoc = db.doc('progress/main');
    dbDoc.onSnapshot(snap => {
      if (!snap.exists) {
        // 云端还没有记录：用这台设备的进度建档
        if (!snap.metadata.fromCache && !seeded) { seeded = true; localVersion++; flush(); }
        return;
      }
      seeded = true;
      if (snap.metadata.hasPendingWrites) return;           // 自己刚写的回显，不用处理
      if (writing || localVersion !== savedVersion) return; // 本地还有没写完的改动，云端快照一律不采纳
      const remote = normalize(snap.data());
      if (state.updatedAt && remote.updatedAt && remote.updatedAt < state.updatedAt) {
        // 本机比云端新（比如上次关页面前没写完）：把本机推上去
        localVersion++; flush();
        return;
      }
      if (!sameContent(remote, state)) {
        state = remote;
        saveLocal();
        render();
      } else if (remote.updatedAt) {
        state.updatedAt = remote.updatedAt;
      }
      setSaveMode('cloud', 'Checkpoint · 已同步到云端');
    }, () => {
      dbDoc = null;
      setSaveMode('local', 'Checkpoint · 云端不可用，已保存在本机');
    });
  }
  // 关页面前把还没写完的改动尽力送出去
  window.addEventListener('pagehide', () => { if (dbDoc && !writing && localVersion !== savedVersion) { clearTimeout(writeTimer); flush(); } });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && dbDoc && !writing && localVersion !== savedVersion) { clearTimeout(writeTimer); flush(); }
    if (document.visibilityState === 'visible' && todayStr() !== lastDay) render();
  });

  /* =========================== 渲染：概览 =========================== */
  function renderStats(ctx) {
    const pct = Math.round(ctx.doneCount / DAYS.length * 100);
    const cur = currentPhase();
    const expected = expectedPhase(ctx.t);
    let paceV, paceCls = '';
    if (ctx.focus.mode === 'finished') paceV = '全部完成';
    else if (ctx.delta > 0) { paceV = '提前 ' + ctx.delta + '<small>天</small>'; paceCls = ' ahead'; }
    else if (ctx.delta < 0) { paceV = '推迟 ' + (-ctx.delta) + '<small>天</small>'; paceCls = ' behind'; }
    else paceV = '按计划';
    const endCmp = ctx.endDate === PLAN_END ? '与计划一致' : '计划 ' + mds(PLAN_END);
    const curDays = cur.days ? dayProgress(cur) : null;
    const curLine = curDays
      ? `第 ${Math.min(curDays.done + 1, curDays.total)} / ${curDays.total} 天 · 计划验收 ${mds(cur.to)}`
      : '阶段已完成';
    document.getElementById('stats').innerHTML = `
      <div class="stat">
        <p class="k">逐日进度</p>
        <p class="v">${ctx.doneCount}<small>/ ${DAYS.length} 天</small></p>
        <div class="bar${ctx.doneCount === DAYS.length ? ' done' : ''}"><i style="width:${pct}%"></i></div>
        <p class="d">本周完成 ${ctx.weekDone} 天 · ${pct}%</p>
      </div>
      <div class="stat">
        <p class="k">节奏</p>
        <p class="v${paceCls}">${paceV}</p>
        <p class="d">${ctx.focus.mode === 'finished' ? '已于' : '预计'} ${mds(ctx.endDate)} 学完 · ${esc(endCmp)}</p>
      </div>
      <div class="stat">
        <p class="k">连续打卡</p>
        <p class="v">${ctx.streak}<small>天</small></p>
        <p class="d">累计打卡 ${ctx.checkins} 天 · 缺卡 ${ctx.missed} 天</p>
      </div>
      <div class="stat">
        <p class="k">当前阶段</p>
        <p class="v">${cur.code}<small>${esc(cur.short)}</small></p>
        <p class="d">${esc(curLine)}${expected && expected.id !== cur.id && expected.days ? ` · <span>按日历应在 ${expected.code}</span>` : ''}</p>
      </div>`;
  }

  function tipsFor(ctx) {
    const tips = [];
    const t = ctx.t, mode = ctx.focus.mode;
    if (t >= START && mode !== 'finished' && isStudyDay(t)) {
      const nx = nextStudyDay(t);
      if (diffDays(t, nx) >= 4) {
        const names = [];
        for (let d = addDays(t, 1); d < nx; d = addDays(d, 1)) if (HOLIDAYS[d] && state.rest[d] !== 'on' && names.indexOf(HOLIDAYS[d]) < 0) names.push(HOLIDAYS[d]);
        tips.push(`明天起休息到 ${md(addDays(nx, -1))}${names.length ? '（' + names.join('、') + '）' : ''}，${md(nx)} 回来。今天收尾：提交代码，写 3 行「回来先做什么」。`);
      }
      const pv = prevStudyDay(t);
      if (pv && pv >= START && diffDays(pv, t) >= 5) tips.push('假期后第一天：先 git pull、uv sync、docker compose up -d，把上次的测试跑一遍，再开始今天的任务。');
    }
    if (mode !== 'finished') {
      if (ctx.delta <= -11) tips.push('已推迟 10 天以上：停止硬追，按「节奏与原则」里的办法整体重排。');
      else if (ctx.delta <= -6) tips.push('已推迟 6 天以上：启用削减阶梯，从第 1 级开始，够了就停。');
      else if (ctx.delta <= -3) tips.push('已推迟 3 天以上：☆ 选做项先全部跳过。');
    }
    return tips.length ? `<ul class="tips">${tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
  }

  function meterHtml(day) {
    const req = reqMinutes(day), dm = doneMinutes(day);
    return `<div><p class="side-k">必做进度</p><p class="meter-v">${dm}<small>/ ${req} 分钟</small></p><div class="bar${dm >= req ? ' done' : ''}"><i style="width:${req ? dm / req * 100 : 0}%"></i></div></div>`;
  }
  function datePills(day, ctx) {
    const base = BASE[day.id], date = effDate(day, ctx);
    const out = [];
    if (date !== base) out.push(pill('', '计划 ' + md(base)));
    const dl = deltaPill(dayDelta(day, ctx));
    if (dl) out.push(dl);
    if (day.gate) out.push(pill('accent', '验收'));
    return out.join('');
  }
  function nextBlock(day, ctx, verb) {
    const p = phaseById(day.phase);
    const date = ctx.proj[day.id];
    const peeking = peekId === day.id;
    return `<div class="next">
      <div class="nw">下一天 · D${day.n} · ${md(date)} ${wd(date)} · ${esc(phaseLabel(p))}</div>
      <div class="nt">${esc(day.t)}</div>
      <div class="today-pills">${datePills(day, ctx)}</div>
      <div><button class="btn ${peeking ? 'quiet' : 'ghost'}" type="button" data-action="${peeking ? 'unpeek' : 'peek'}" data-day="${day.id}">${peeking ? '收起' : esc(verb)}</button></div>
      ${peeking ? `<div class="peek">${tasksHtml(day)}${critHtml(day)}<div class="actions"><button class="btn" type="button" data-action="complete-day" data-day="${day.id}">★ 全部完成</button><span>完成后，后面的预计日期会自动往前挪。</span></div>${refsHtml(day, 'inline')}</div>` : ''}
    </div>`;
  }

  function renderToday(ctx) {
    const el = document.getElementById('today');
    const f = ctx.focus, t = ctx.t;
    const when = `今天 · ${md(t)} ${wd(t)}`;
    if (f.mode === 'finished') {
      el.innerHTML = `<div class="today-head"><div><p class="when">${esc(when)}</p><h2>${DAYS.length} 天的逐日任务全部完成</h2></div><div class="today-pills">${pill('done', '全部完成')}</div></div>
        <div class="today-body"><div class="today-main"><p class="rest-note">最后一天完成于 ${esc(ctx.endDate)}，计划终点是 ${esc(PLAN_END)}。到「节奏与原则」写一份终局复盘，再把蓝图末尾的「进度追踪」更新掉。</p></div></div>`;
      return;
    }
    const day = f.day, p = phaseById(day.phase);
    let head, main, side;
    if (f.mode === 'todo') {
      head = `<div><p class="when">${esc(when)} · D${day.n} / ${DAYS.length} · ${esc(phaseLabel(p))}</p><h2><span class="code">${day.id.toUpperCase()}</span>${esc(day.t)}</h2></div>
        <div class="today-pills">${pill('solid', '今日任务')}${datePills(day, ctx)}</div>`;
      main = `${tasksHtml(day)}<p class="legend-line">★ 必做，合计 ${reqMinutes(day)} 分钟；☆ 选做，不影响当天是否完成。</p>${critHtml(day)}
        <div class="actions"><button class="btn" type="button" data-action="complete-day" data-day="${day.id}">★ 全部完成</button><span>勾完所有 ★ 会自动记为今天完成。提交时写 <code>checkin: ${day.id.toUpperCase()}</code>。</span></div>`;
      const after = ctx.pending[1];
      side = meterHtml(day) + (day.ref ? `<div><p class="side-k">本日资料</p>${refsHtml(day)}</div>` : '') +
        (after ? `<div><p class="side-k">下一天</p><div class="nw mono" style="font-size:12px;color:var(--ink-3)">D${after.n} · ${md(ctx.proj[after.id])} ${wd(ctx.proj[after.id])}</div><div style="font-size:13.5px;font-weight:500">${esc(after.t)}</div></div>` : '');
    } else if (f.mode === 'done') {
      const list = ctx.doneToday;
      head = `<div><p class="when">${esc(when)} · 今日已完成</p><h2>${list.length > 1 ? '今天完成了 ' + list.length + ' 天的任务' : '今天的 2 小时已完成'}</h2></div>
        <div class="today-pills">${pill('done', '今日已完成')}${ctx.delta > 0 ? pill('ahead', '提前 ' + ctx.delta + ' 天') : ''}</div>`;
      main = `<div class="done-list">${list.map(d => `<div class="done-row"><span class="ok">✓</span><span class="grow"><b>D${d.n}</b> · ${esc(d.t)}</span><label>完成于 <input class="date-in" type="date" data-donedate="${d.id}" value="${esc(state.days[d.id])}" max="${t}" aria-label="D${d.n} 完成日期"></label></div>`).join('')}</div>
        ${nextBlock(day, ctx, '提前开始 D' + day.n)}`;
      side = `<div><p class="side-k">接下来</p><p style="margin:0;font-size:13.5px;color:var(--ink-2)">D${day.n} 预计在 ${md(ctx.proj[day.id])} ${wd(ctx.proj[day.id])}。有余力可以现在就做，做完后面所有日期自动往前挪。补打卡时把「完成于」改成实际那天。</p></div>` +
        (day.ref ? `<div><p class="side-k">D${day.n} 的资料</p>${refsHtml(day)}</div>` : '');
    } else {
      const nd = ctx.proj[day.id];
      head = `<div><p class="when">${esc(when)} · ${esc(restLabel(t))}</p><h2>${t < START ? '计划从 ' + md(START) + ' 开始' : '今天休息'}</h2></div>
        <div class="today-pills">${pill('', restLabel(t))}</div>`;
      main = `<p class="rest-note">周末和节假日不排任务。下一个学习日是 ${md(nd)} ${wd(nd)}。想提前做也可以，做完同样会把后面的日期往前挪。</p>${nextBlock(day, ctx, '提前开始 D' + day.n)}`;
      side = day.ref ? `<div><p class="side-k">D${day.n} 的资料</p>${refsHtml(day)}</div>` : `<div><p class="side-k">接下来</p><p style="margin:0;font-size:13.5px;color:var(--ink-2)">${esc(phaseLabel(p))} · 计划验收 ${mds(p.to)}</p></div>`;
    }
    el.innerHTML = `<div class="today-head">${head}</div>${tipsFor(ctx)}<div class="today-body"><div class="today-main">${main}</div><aside class="today-side">${side}</aside></div>`;
  }

  /* =========================== 渲染：状态图 + 打卡日历 =========================== */
  function ring(pct, label, status) {
    const r = 24, c = 2 * Math.PI * r;
    return `<span class="ring"><svg viewBox="0 0 56 56" width="56" height="56" aria-hidden="true"><circle class="track" cx="28" cy="28" r="${r}"/><circle class="fill" cx="28" cy="28" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - pct)).toFixed(1)}"/></svg><b>${status === 'done' ? '✓' : label}</b></span>`;
  }
  function renderGraph(ctx) {
    const expected = expectedPhase(ctx.t);
    const sel = selectedPhaseId();
    document.getElementById('nodes').innerHTML = PLAN.phases.map(p => {
      const st = statusOf(p), pct = ringPct(p);
      const stLabel = st === 'done' ? '已完成' : st === 'active' ? '进行中' : '未开始';
      const wk = p.closed ? '已完成 · ' + mds(p.closed) : mds(p.from) + '–' + mds(p.to) + ' · ' + p.days.length + ' 天';
      return `<button class="node" type="button" data-phase="${p.id}" data-status="${st}" aria-pressed="${sel === p.id}" title="${esc(p.name)}">
        ${expected && expected.id === p.id && !p.closed ? '<span class="here">按日历</span>' : ''}
        ${ring(pct, Math.round(pct * 100) + '%', st)}
        <span class="nm">${esc(p.short)}</span>
        <span class="wk">${esc(wk)}</span>
        <span class="pill ${st} st">${p.code} ${stLabel}</span>
      </button>`;
    }).join('');
    renderCalendar(ctx);
  }

  function renderCalendar(ctx) {
    const t = ctx.t;
    const first = mondayOf(START);
    let last = [t, PLAN_END, ctx.endDate].concat(Object.values(state.days)).reduce((a, b) => (b > a ? b : a));
    last = addDays(mondayOf(last), 6);
    const cols = Math.floor(diffDays(first, last) / 7) + 1;
    const phaseIdx = {};
    PLAN.phases.forEach((p, i) => { phaseIdx[p.id] = i; });
    const cells = [];
    ['一', '', '三', '', '五', '末', ''].forEach((l, r) => { if (l) cells.push(`<span class="cal-w" style="grid-row:${r + 2}">${l}</span>`); });
    // 月份标在该月第一个周一所在的列；和下一个标签相隔不到 3 列就省掉，避免文字重叠
    const months = [];
    for (let c = 0; c < cols; c++) {
      const key = addDays(first, c * 7).slice(0, 7);
      if (!months.length || months[months.length - 1].key !== key) months.push({ c, key });
    }
    months.filter((m, i) => !months[i + 1] || months[i + 1].c - m.c >= 3).forEach(m => {
      cells.push(`<span class="cal-m" style="grid-column:${m.c + 2}">${m.key.slice(5) === '01' ? m.key.slice(2, 4) + '年' : ''}${+m.key.slice(5)}月</span>`);
    });
    for (let c = 0; c < cols; c++) {
      const mon = addDays(first, c * 7);
      for (let r = 0; r < 7; r++) {
        const d = addDays(mon, r);
        const cls = ['cc'];
        let title = md(d) + ' ' + wd(d);
        let dayId = null;
        if (d < START && !ctx.byDate[d]) { cls.push('pre'); title = ''; }
        else if (ctx.byDate[d]) {
          const ds = ctx.byDate[d];
          cls.push(ds.length > 1 ? 'done2' : 'done');
          title += ' · 完成 ' + ds.map(x => 'D' + x.n).join('、') + '：' + ds[0].t;
          dayId = ds[0].id;
        } else if (d < t) {
          const s = ctx.pastState[d] || 'rest';
          if (s === 'rest') { cls.push(HOLIDAYS[d] && state.rest[d] !== 'on' ? 'hol' : 'rest'); title += ' · ' + restLabel(d); }
          else if (s === 'covered') { cls.push('covered'); title += ' · 没打卡，但进度不落后'; }
          else { cls.push('missed'); title += ' · 缺卡'; }
        } else {
          const pj = ctx.projByDate[d];
          if (pj) { cls.push('plan'); if (phaseIdx[pj[0].phase] % 2) cls.push('alt'); title += ' · 预计 D' + pj[0].n + ' ' + pj[0].t; dayId = pj[0].id; }
          else if (!isStudyDay(d)) { cls.push(HOLIDAYS[d] && state.rest[d] !== 'on' ? 'hol' : 'rest'); title += ' · ' + restLabel(d); }
          else { cls.push('free'); title += ' · 学习日（逐日任务已排完）'; }
        }
        if (d === t) { cls.push('today'); title = '今天 · ' + title; }
        const pos = `grid-column:${c + 2};grid-row:${r + 2}`;
        cells.push(dayId
          ? `<button type="button" class="${cls.join(' ')}" style="${pos}" title="${esc(title)}" aria-label="${esc(title)}" data-action="goto-day" data-day="${dayId}"></button>`
          : `<span class="${cls.join(' ')}" style="${pos}"${title ? ` title="${esc(title)}"` : ''}></span>`);
      }
    }
    const grid = document.getElementById('cal');
    grid.style.setProperty('--cols', cols);
    grid.innerHTML = cells.join('');
    document.getElementById('calNote').textContent = `${mds(START)} 起 · 已打卡 ${ctx.checkins} 天 · 点有任务的格子跳到那一天`;
    document.getElementById('calLegend').innerHTML = [
      ['done', '已打卡'], ['covered', '没打卡但不落后'], ['missed', '缺卡'], ['plan', '预计学习日'], ['plan alt', '预计学习日（相邻阶段）'], ['hol', '节假日'], ['rest', '周末 / 休息'], ['today', '今天']
    ].map(x => `<span><i class="cc ${x[0]}"></i>${x[1]}</span>`).join('');
  }

  /* =========================== 渲染：标签与面板 =========================== */
  function selectedPhaseId() { return PLAN.phases.some(p => p.id === activeTab) ? activeTab : null; }
  function renderTabs() {
    const items = [`<button class="tab lead" role="tab" type="button" data-tab="daily" aria-selected="${activeTab === 'daily'}">逐日计划</button>`];
    // 已完成的阶段只显示编号，给进行中和后面的阶段留出一行的宽度
    PLAN.phases.forEach(p => items.push(`<button class="tab" role="tab" type="button" data-tab="${p.id}" aria-selected="${activeTab === p.id}" title="${esc(p.code + ' ' + p.name)}"${p.closed ? ` aria-label="${esc(p.code + ' ' + p.name + '（已完成）')}"` : ''}><span class="mini ${statusOf(p)}"></span><span class="code">${p.code}</span>${p.closed ? '' : esc(p.short)}</button>`));
    items.push(`<button class="tab util" role="tab" type="button" data-tab="jd" aria-selected="${activeTab === 'jd'}">JD 基准</button>`);
    items.push(`<button class="tab" role="tab" type="button" data-tab="rhythm" aria-selected="${activeTab === 'rhythm'}">节奏与原则</button>`);
    document.getElementById('tabs').innerHTML = items.join('');
  }

  function dayState(day, ctx) {
    if (state.days[day.id]) return 'done';
    if (ctx.focus.mode === 'todo' && ctx.focus.day && ctx.focus.day.id === day.id) return 'focus';
    return doneMinutes(day) > 0 || day.k.some((_, i) => state.tasks[day.id + '.' + i]) ? 'part' : 'todo';
  }
  function dayRow(day, ctx) {
    const st = dayState(day, ctx);
    const done = state.days[day.id];
    const date = effDate(day, ctx);
    const base = BASE[day.id];
    const pills = [];
    if (st === 'focus') pills.push(pill('solid', '今天'));
    if (!done) {
      if (date !== base) pills.push(pill('', '计划 ' + md(base)));
      const dl = deltaPill(dayDelta(day, ctx)); if (dl) pills.push(dl);
    } else if (done !== base) pills.push(pill('', '计划 ' + md(base)));
    if (st === 'part' && doneMinutes(day) > 0) pills.push(pill('active', '★ ' + doneMinutes(day) + '/' + reqMinutes(day) + '′'));
    if (day.gate) pills.push(pill('accent', '验收'));
    const key = 'd:' + day.id;
    const open = key in openState ? openState[key] : st === 'focus';
    const foot = done
      ? `<label>完成于 <input class="date-in" type="date" data-donedate="${day.id}" value="${esc(done)}" max="${ctx.t}" aria-label="D${day.n} 完成日期"></label><button class="btn quiet" type="button" data-action="undo-day" data-day="${day.id}">改回未完成</button>`
      : `<button class="btn${st === 'focus' ? '' : ' ghost'}" type="button" data-action="complete-day" data-day="${day.id}">★ 全部完成</button>`;
    return `<details class="day" id="day-${day.id}" data-key="${key}" data-st="${st}"${open ? ' open' : ''}>
      <summary><span class="dst" aria-hidden="true"></span><span class="dwhen"><span class="n">D${day.n}</span>${md(date)} ${wd(date)}${done ? ' 完成' : ''}</span><span class="dtitle">${esc(day.t)}</span><span class="dmeta">${pills.join('')}</span></summary>
      <div class="day-body">${tasksHtml(day)}${critHtml(day)}${refsHtml(day, 'inline')}<div class="day-foot">${foot}<span>提交时写 <code>checkin: ${day.id.toUpperCase()}</code></span></div></div>
    </details>`;
  }
  function matchFilter(day) {
    if (dailyFilter === 'todo') return !state.days[day.id];
    if (dailyFilter === 'done') return !!state.days[day.id];
    return true;
  }
  function renderDaily(ctx) {
    const cur = currentPhase();
    const focusPhase = ctx.focus.day ? ctx.focus.day.phase : null;
    const weekNo = d => Math.floor(diffDays(mondayOf(START), mondayOf(d)) / 7) + 1;
    const nowWeek = weekNo(ctx.t);
    const sections = PLAN.phases.filter(p => p.days).map(p => {
      const dp = dayProgress(p);
      const rows = [];
      let lastWeek = 0;
      p.days.forEach(day => {
        if (!matchFilter(day)) return;
        const d = effDate(day, ctx);
        const w = weekNo(d);
        if (w > lastWeek) {
          const mon = mondayOf(d), fri = addDays(mon, 4);
          rows.push(`<div class="dl-week"><span>第 ${w} 周 · ${md(mon < START ? START : mon)} – ${md(fri)}</span>${w === nowWeek ? '<span class="now">本周</span>' : ''}</div>`);
          lastWeek = w;
        }
        rows.push(dayRow(day, ctx));
      });
      if (!rows.length) return '';
      const last = p.days[p.days.length - 1];
      const lastDate = effDate(last, ctx);
      const endPill = dp.done === dp.total
        ? pill('done', '已于 ' + md(lastDate) + ' 完成')
        : lastDate !== p.to ? pill(lastDate < p.to ? 'ahead' : 'behind', '按当前进度 ' + md(lastDate) + ' 完成') : '';
      const key = 'p:' + p.id;
      const open = key in openState ? openState[key] : (p.id === cur.id || p.id === focusPhase);
      return `<details class="dl-phase" data-key="${key}"${open ? ' open' : ''}>
        <summary><span class="chev" aria-hidden="true"></span><div><h3><span class="code">${p.code}</span>${esc(p.name)}</h3>
          <div class="pmeta">${pill(statusOf(p), dp.done + ' / ' + dp.total + ' 天')}${pill('', '计划 ' + mds(p.from) + ' – ' + mds(p.to))}${p.holNote ? pill('', '含' + p.holNote) : ''}${endPill}</div></div></summary>
        ${rows.join('')}
      </details>`;
    }).join('');
    const counts = { all: DAYS.length, todo: ctx.pending.length, done: ctx.doneCount };
    document.getElementById('panel').innerHTML = `
      <div class="dl-tools">
        <div class="seg" role="group" aria-label="筛选">${[['all', '全部'], ['todo', '未完成'], ['done', '已完成']].map(x => `<button type="button" data-action="filter" data-filter="${x[0]}" aria-pressed="${dailyFilter === x[0]}">${x[1]} ${counts[x[0]]}</button>`).join('')}</div>
        <span class="note">共 ${DAYS.length} 个学习日，每天 ★ 120 分钟 · 计划 ${mds(START)} → ${mds(PLAN_END)}</span>
        ${ctx.focus.day ? `<button class="btn ghost" type="button" data-action="goto-day" data-day="${ctx.focus.day.id}">定位到${ctx.focus.mode === 'todo' ? '今天' : '下一天'}</button>` : ''}
      </div>
      ${sections || '<p class="empty">没有符合筛选的任务。</p>'}`;
  }

  function checkItem(id, text, hint) {
    const on = !!state.done[id];
    return `<li><label class="item${on ? ' checked' : ''}"><input type="checkbox" data-id="${id}"${on ? ' checked' : ''}><span class="t">${esc(text)}${hint ? `<span class="hint">${esc(hint)}</span>` : ''}</span></label></li>`;
  }
  function renderPhase(p, ctx) {
    const pr = progress(p); const dl = delivProgress(p); const st = statusOf(p);
    const tDone = p.topics.filter((_, i) => state.done[p.id + '.t' + i]).length;
    const rDone = p.resources.filter((_, i) => state.done[p.id + '.r' + i]).length;
    const vDone = p.videos.filter((_, i) => state.done[p.id + '.v' + i]).length;
    const jdTags = p.jd.map(t => `<span class="jd-tag${/必备/.test(t) ? ' must' : ''}">${esc(t)}</span>`).join('');
    const review = state.reviewed[p.id] || '';
    const dp = p.days ? dayProgress(p) : null;
    const span = p.days ? mds(p.from) + ' – ' + mds(p.to) + ' · ' + p.days.length + ' 个学习日' : mds(p.from) + ' – ' + mds(p.to);
    const notes = [p.note, p.holNote ? '含' + p.holNote + '，不排任务。' : ''].filter(Boolean).join(' ');

    const resList = p.resources.length ? `<ul class="res">${p.resources.map((r, i) => {
      const id = p.id + '.r' + i; const on = !!state.done[id];
      return `<li class="${on ? 'checked' : ''}"><label class="rrow"><input type="checkbox" data-id="${id}" aria-label="已读：${esc(r[0])}"${on ? ' checked' : ''}><div><div class="rt"><a href="${r[1]}" target="_blank" rel="noopener">${esc(r[0])}</a><span class="chip">${TYPE_ZH[r[2]] || r[2]}</span><span class="chip ${r[3] === 'ZH' ? 'zh' : 'en'}">${r[3]}</span></div>${r[4] ? `<div class="rn">${esc(r[4])}</div>` : ''}</div></label></li>`;
    }).join('')}</ul>` : '<p class="empty">本阶段没有额外资料。</p>';
    const vidList = p.videos.length ? `<ul class="res vid">${p.videos.map((v, i) => {
      const id = p.id + '.v' + i; const on = !!state.done[id];
      return `<li class="${on ? 'checked' : ''}"><label class="rrow"><input type="checkbox" data-id="${id}" aria-label="已看：${esc(v[0])}"${on ? ' checked' : ''}><div><div class="rt"><a href="${v[2]}" target="_blank" rel="noopener">${esc(v[0])}</a><span class="chip ${v[3] === 'ZH' ? 'zh' : 'en'}">${v[3] === 'ZH' ? '中文' : 'EN'}</span>${v[4] ? `<span class="chip len">${esc(v[4])}</span>` : ''}</div><div class="rn"><span class="ch">${esc(v[1])}</span>${v[5] ? ' · ' + esc(v[5]) : ''}</div></div></label></li>`;
    }).join('')}</ul>` : '<p class="empty">准备周不需要看视频，把环境配好就是最好的学习。</p>';
    const proj = p.project ? `<div class="proj">
        <p class="pn"><span class="code">${p.project.code}</span>${esc(p.project.name)}</p>
        <p>${esc(p.project.desc)}</p>
        <ol>${p.project.build.map(b => `<li>${esc(b)}</li>`).join('')}</ol>
      </div>` : '<p class="empty">准备周没有里程碑项目；产出就是一个能跑的环境和仓库骨架。</p>';
    const dayList = p.days ? `<section class="block">
        <h3>逐日任务 <span class="cnt">${dp.done} / ${dp.total} 天</span></h3>
        <p class="lead">日期是当前的预计日期（已完成的显示完成日）；点一天到「逐日计划」里打卡。</p>
        <ul class="plist">${p.days.map(day => {
          const s = dayState(day, ctx); const d = effDate(day, ctx);
          return `<li><button type="button" data-action="goto-day" data-day="${day.id}"><span class="dot ${s}"></span><span class="w">D${day.n} · ${md(d)} ${wd(d)}</span><span class="tt${s === 'done' ? ' done' : ''}">${esc(day.t)}${day.gate ? ' · 验收' : ''}</span></button></li>`;
        }).join('')}</ul>
      </section>` : '';

    document.getElementById('panel').innerHTML = `
      <div class="phead">
        <div>
          <h2><span class="code">${p.code}</span>${esc(p.name)}</h2>
          <div class="meta">
            <span class="pill ${st}">${st === 'done' ? '已完成' : st === 'active' ? '进行中' : '未开始'}</span>
            <span class="pill accent">${esc(span)}</span>
            <span class="pill">≈ ${p.hours} 小时</span>
          </div>
          <p class="goal">${esc(p.goal)}</p>
          ${notes ? `<p class="pnote">${esc(notes)}</p>` : ''}
          ${jdTags ? `<div class="jd-tags">${jdTags}</div>` : ''}
        </div>
        <aside class="pside">
          ${dp ? `<div class="row"><span>逐日任务</span><b>${dp.done} / ${dp.total} 天</b></div><div class="bar${dp.done === dp.total ? ' done' : ''}" style="margin:8px 0 12px"><i style="width:${dp.pct * 100}%"></i></div>` : ''}
          <div class="row"><span>清单完成率</span><b>${Math.round(pr.pct * 100)}%（${pr.done}/${pr.total}）</b></div>
          <div class="row"><span>验收成果</span><b>${dl.done} / ${dl.total}</b></div>
          <div class="row"><span>学习内容</span><b>${tDone} / ${p.topics.length}</b></div>
          <div class="row"><span>资料 · 视频</span><b>${rDone} / ${p.resources.length} · ${vDone} / ${p.videos.length}</b></div>
          <div class="row"><span>验收日期<small style="color:var(--ink-3)"> · 计划 ${mds(p.to)}</small></span><input type="date" data-review="${p.id}" value="${esc(review)}" aria-label="${p.code} 实际验收日期"></div>
        </aside>
      </div>
      <div class="cols">
        <div class="col">
          <section class="block">
            <h3>学习内容 <span class="cnt">${tDone} / ${p.topics.length}</span></h3>
            <p class="lead">带着项目里的具体问题读，读到能动手的点就停下来做。</p>
            <ul class="list">${p.topics.map((t, i) => checkItem(p.id + '.t' + i, t[0], t[1])).join('')}</ul>
          </section>
          <section class="block">
            <h3>项目实践</h3>
            ${proj}
          </section>
          <section class="block">
            <h3>输出成果 · 验收 <span class="cnt">${dl.done} / ${dl.total}</span></h3>
            <p class="lead">全部打勾即视为本阶段验收通过；每一项都应该能写进简历或在面试里讲出数字。</p>
            <ul class="list">${p.deliverables.map((d, i) => checkItem(p.id + '.d' + i, d[0], d[1])).join('')}</ul>
          </section>
        </div>
        <div class="col">
          ${dayList}
          <section class="block">
            <h3>权威资料 <span class="cnt">${rDone} / ${p.resources.length}</span></h3>
            <p class="lead">官方文档、原始论文与一手文章；勾选表示已读。</p>
            ${resList}
          </section>
          <section class="block">
            <h3>视频 <span class="cnt">${vDone} / ${p.videos.length}</span></h3>
            <p class="lead">中文视频用来建立直觉，英文官方视频用来对齐一手口径。</p>
            ${vidList}
          </section>
        </div>
      </div>`;
  }

  function renderJd() {
    const rows = PLAN.jd.map(r => `<tr>

  function renderRhythm() {
    document.getElementById('panel').innerHTML = `<div class="doc">

      <p>被砍的那天照样打卡，做降级后的版本。不能砍：Milvus + ES 双实现与混合检索 + Rerank + Ragas；LangGraph 持久化与 interrupt；3 个 MCP Server；Judge 校准；CI 回归；P6 一键部署。这些是简历上的数字来源。整体提前时，把多出来的时间投到 M5（评测与上下文工程），那是投入产出比最高的部分。</p>
      <h3>休息日与假期</h3>
      <p>默认按下表不排任务。2027 年的官方放假安排公布后，在这里按实际日期调整；临时有事请假，也在这里加一天休息日。改动只影响预计日期，计划日期和阶段日期不变。</p>
      ${restSettingsHtml()}
      <h3>每周回顾（可选，周五花 10 分钟写进 journal/）</h3>
<pre>第 N 周回顾
- 本周完成 ___ 天（看页面顶部「逐日进度」），提前 / 推迟 ___ 天
- 一个数字（本周项目里能量化的一个结果）：
- 一个坑（踩了什么、怎么解决）：
- 一个问题（还没想明白的，下周优先解决）：</pre>
      <h3>三条原则</h3>
      <div class="principles">
        <div class="principle"><b>项目驱动，评测先行</b><p>每个项目在写 Agent 之前先写 10 条测试用例。能不能说出"改了 X 之后指标从 71% 到 84%"，是档位的分水岭。</p></div>
        <div class="principle"><b>主线一条，广度靠对照</b><p>LangGraph 深挖到源码级；其余框架用"读设计 + 做一次同任务对照实验"覆盖，不平均用力。</p></div>
        <div class="principle"><b>用资深研发的肌肉记忆</b><p>状态机、契约设计、可观测、幂等重试、测试金字塔，直接迁移到 Agent 工程上。这是与应届 AI 候选人拉开差距的地方。</p></div>
      </div>
      <h3>七个反模式</h3>
      <ul class="anti">
        <li><b>课程囤积症。</b>只看不做。任何课程时间不超过当周项目时间的三分之一。</li>
        <li><b>框架跳跃。</b>同时学五个框架，每个都停在 quickstart。LangGraph 是唯一主线。</li>
        <li><b>没有评测的 Demo。</b>面试时说不出任何数字。先写用例再写 Agent。</li>
        <li><b>过早追新、死记 API。</b>MCP 规范每半年一变。学"为什么这样设计"，API 细节现查。</li>
        <li><b>把 Agent 当银弹。</b>确定性工作流能解决的不要上 Agent；多 Agent 会带来上下文碎片化和成本翻倍。</li>
        <li><b>忽视成本与安全。</b>从 P1 起记成本，从 P3 起做工具权限最小化和 prompt injection 防护。</li>
        <li><b>用老经验硬套。</b>状态机思维是优势，但"断言相等"式的测试思维要换成"评分与阈值"。</li>
      </ul>
    </div>`;
  }

  function renderPanel(ctx) {
    if (activeTab === 'daily') renderDaily(ctx);
    else if (activeTab === 'jd') renderJd();
    else if (activeTab === 'rhythm') renderRhythm();
    else renderPhase(phaseById(activeTab) || currentPhase(), ctx);
  }

  // 重渲染前记住哪些折叠面板开着、操作的元素在屏幕上的位置，渲染后还原，页面不跳
  function captureOpen() {
    document.querySelectorAll('details[data-key]').forEach(d => { openState[d.dataset.key] = d.open; });
  }
  function anchorOf(el) {
    if (!el || !el.dataset) return null;
    let sel = null;
    if (el.dataset.task) sel = `[data-task="${el.dataset.task}"]`;
    else if (el.dataset.id) sel = `[data-id="${el.dataset.id}"]`;
    else if (el.dataset.action && el.dataset.day) sel = `[data-action="${el.dataset.action}"][data-day="${el.dataset.day}"]`;
    if (!sel) return null;
    const scope = el.closest('#today') ? '#today ' : el.closest('#panel') ? '#panel ' : '';
    return { sel: scope + sel, top: el.getBoundingClientRect().top, focus: el === document.activeElement };
  }
  function render(anchorEl, keepOpenState) {
    const anchor = anchorOf(anchorEl);
    if (!keepOpenState) captureOpen();
    const ctx = computeCtx();
    lastDay = ctx.t;
    renderStats(ctx);
    renderToday(ctx);
    renderGraph(ctx);
    renderTabs();
    renderPanel(ctx);
    document.getElementById('footSched').textContent = `计划日期按 ${START} 起的工作日排定，终点 ${PLAN_END}；预计日期随打卡滚动。`;
    if (anchor) {
      const el = document.querySelector(anchor.sel);
      if (el) {
        const dy = el.getBoundingClientRect().top - anchor.top;
        if (Math.abs(dy) > 1) window.scrollBy(0, dy);
        if (anchor.focus) { try { el.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
      }
    }
  }

  /* =========================== 事件 =========================== */
  function updateDayDone(day) {
    const all = reqTasks(day).every(i => state.tasks[day.id + '.' + i]);
    if (all && !state.days[day.id]) state.days[day.id] = todayStr();
    if (!all && state.days[day.id]) delete state.days[day.id];
  }
  function gotoDay(id) {
    const day = DAY_BY_ID[id]; if (!day) return;
    activeTab = 'daily'; rememberTab();
    if (!matchFilter(day)) { dailyFilter = 'all'; rememberFilter(); }
    captureOpen();
    openState['p:' + day.phase] = true;
    openState['d:' + id] = true;
    render(null, true);
    const el = document.getElementById('day-' + id);
    if (el) {
      const smooth = !window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
    }
  }
  function setRest(date, val) {
    if (!parseDate(date)) return false;
    if (val === null) delete state.rest[date];
    else if ((val === 'off' && !isBaseWorkday(date)) || (val === 'on' && isBaseWorkday(date))) delete state.rest[date]; // 和默认一致，不用存
    else state.rest[date] = val;
    return true;
  }

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('input[data-task]')) {
      const id = t.dataset.task;
      if (t.checked) state.tasks[id] = true; else delete state.tasks[id];
      updateDayDone(DAY_BY_ID[id.slice(0, id.lastIndexOf('.'))]);
      touch(); render(t);
    } else if (t.matches('input[data-id]')) {
      const id = t.dataset.id;
      if (t.checked) state.done[id] = true; else delete state.done[id];
      touch(); render(t);
    } else if (t.matches('input[data-review]')) {
      const pid = t.dataset.review;
      if (t.value) state.reviewed[pid] = t.value; else delete state.reviewed[pid];
      touch();
    } else if (t.matches('input[data-donedate]')) {
      const id = t.dataset.donedate;
      if (parseDate(t.value) && t.value <= todayStr()) { state.days[id] = t.value; touch(); render(t); }
      else t.value = state.days[id] || '';
    }
  });

  document.addEventListener('click', e => {
    const a = e.target.closest('[data-action]');
    if (a) {
      const act = a.dataset.action, id = a.dataset.day;
      if (act === 'complete-day') {
        const day = DAY_BY_ID[id];
        reqTasks(day).forEach(i => { state.tasks[id + '.' + i] = true; });
        if (!state.days[id]) state.days[id] = todayStr();
        if (peekId === id) peekId = null;
        touch(); render(a);
      } else if (act === 'undo-day') {
        const day = DAY_BY_ID[id];
        reqTasks(day).forEach(i => { delete state.tasks[id + '.' + i]; });
        delete state.days[id];
        touch(); render(a);
      } else if (act === 'peek') { peekId = id; render(a); }
      else if (act === 'unpeek') { peekId = null; render(a); }
      else if (act === 'goto-day') { e.preventDefault(); gotoDay(id); }
      else if (act === 'filter') { dailyFilter = a.dataset.filter; rememberFilter(); render(); }
      else if (act === 'toggle-hol') {
        const d = a.dataset.date;
        setRest(d, state.rest[d] === 'on' ? null : 'on');
        touch(); render();
      } else if (act === 'rest-off' || act === 'rest-on') {
        const input = document.getElementById('restDate');
        const v = input && input.value;
        if (!parseDate(v)) { const m = document.getElementById('restMsg'); if (m) m.textContent = '先选一个日期。'; return; }
        setRest(v, act === 'rest-off' ? 'off' : 'on');
        touch(); render();
      } else if (act === 'rest-clear') {
        setRest(a.dataset.date, null);
        touch(); render();
      }
      return;
    }
    const node = e.target.closest('.node[data-phase]');
    if (node) { activeTab = node.dataset.phase; rememberTab(); render(); document.getElementById('tabs').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const tab = e.target.closest('.tab[data-tab]');
    if (tab) { activeTab = tab.dataset.tab; rememberTab(); render(); return; }
    if (e.target.id === 'reset') {
      const btn = e.target;
      if (btn.dataset.armed === '1') {
        state = Object.assign(blankState(), { startDate: state.startDate });
        peekId = null;
        touch(); render();
        btn.dataset.armed = ''; btn.textContent = '重置全部进度'; btn.classList.remove('warn');
      } else {
        btn.dataset.armed = '1'; btn.textContent = '再点一次确认清空所有勾选和打卡'; btn.classList.add('warn');
        setTimeout(() => { btn.dataset.armed = ''; btn.textContent = '重置全部进度'; btn.classList.remove('warn'); }, 4000);
      }
    }
  });

  function rememberTab() { try { localStorage.setItem(LS_TAB, activeTab); } catch (e) { /* ignore */ } }
  function rememberFilter() { try { localStorage.setItem(LS_VIEW, dailyFilter); } catch (e) { /* ignore */ } }

  /* =========================== 启动 =========================== */
  const local = loadLocal();
  if (local) state = local;
  try {
    const t = localStorage.getItem(LS_TAB);
    if (t && (t === 'daily' || t === 'jd' || t === 'rhythm' || PLAN.phases.some(p => p.id === t))) activeTab = t;
    const f = localStorage.getItem(LS_VIEW);
    if (f === 'all' || f === 'todo' || f === 'done') dailyFilter = f;
  } catch (e) { /* ignore */ }
  render();
  initDb();
  // 页面一直开着跨过凌晨 4 点时，自动换到新的一天
  setInterval(() => { if (todayStr() !== lastDay) render(); }, 60000);
})();
</script>
