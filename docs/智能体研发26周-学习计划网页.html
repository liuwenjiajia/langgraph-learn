<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能体研发 26 周</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F2F3EF;
    --surface: #FFFFFF;
    --surface-2: #E8EAE4;
    --ink: #1A1D21;
    --ink-2: #4B535C;
    --ink-3: #7B838C;
    --line: #D3D7CF;
    --line-strong: #B9BEB5;
    --accent: #1F4FD8;
    --accent-ink: #FFFFFF;
    --accent-soft: #E3E9FB;
    --done: #178A55;
    --done-soft: #DDF3E7;
    --active: #C7780C;
    --active-soft: #FBEBD1;
    --todo: #9AA1A9;
    --todo-soft: #ECEEEA;
    --shadow: 0 1px 2px rgba(20, 24, 28, .06), 0 6px 20px -12px rgba(20, 24, 28, .18);
    --radius: 10px;
    --font-body: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --font-mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181C;
      --surface: #1D2126;
      --surface-2: #262B31;
      --ink: #E8EAE6;
      --ink-2: #B4BAB6;
      --ink-3: #858C91;
      --line: #343A41;
      --line-strong: #454C54;
      --accent: #85A3FF;
      --accent-ink: #0F1A3A;
      --accent-soft: #24304F;
      --done: #4FC48A;
      --done-soft: #1B3A2B;
      --active: #E9A23B;
      --active-soft: #3D2E14;
      --todo: #6C737A;
      --todo-soft: #2A2F35;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181C;
    --surface: #1D2126;
    --surface-2: #262B31;
    --ink: #E8EAE6;
    --ink-2: #B4BAB6;
    --ink-3: #858C91;
    --line: #343A41;
    --line-strong: #454C54;
    --accent: #85A3FF;
    --accent-ink: #0F1A3A;
    --accent-soft: #24304F;
    --done: #4FC48A;
    --done-soft: #1B3A2B;
    --active: #E9A23B;
    --active-soft: #3D2E14;
    --todo: #6C737A;
    --todo-soft: #2A2F35;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .page { max-width: 1240px; margin: 0 auto; padding: 28px 24px 80px; }
  @media (max-width: 640px) { .page { padding: 18px 14px 60px; } }

  /* ---------- header ---------- */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--line-strong); }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.2; margin: 0; letter-spacing: .01em; text-wrap: balance; }
  .sub { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
  .sub b { font-weight: 500; color: var(--ink); }
  .save { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 10px; }
  .save .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--todo); }
  .save[data-mode="cloud"] .dot { background: var(--done); }
  .save[data-mode="local"] .dot { background: var(--active); }
  .save[data-mode="saving"] .dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---------- stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 12px; min-width: 0; }
  .stat .k { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
  .stat .v { font-family: var(--font-mono); font-size: 26px; font-weight: 500; line-height: 1.1; margin: 0; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .stat .v small { font-size: 13px; color: var(--ink-3); font-weight: 400; }
  .stat .d { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .35s ease; }
  .bar.done i { background: var(--done); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1; padding: 5px 8px; border-radius: 999px; background: var(--todo-soft); color: var(--ink-2); white-space: nowrap; }
  .pill.done { background: var(--done-soft); color: var(--done); }
  .pill.active { background: var(--active-soft); color: var(--active); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }
  .pill.ahead { background: var(--done-soft); color: var(--done); }
  .pill.behind { background: var(--active-soft); color: var(--active); }

  /* ---------- state graph ---------- */
  .graph { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 16px; box-shadow: var(--shadow); }
  .graph-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .graph-head h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0; }
  .graph-head p { margin: 0; font-size: 13px; color: var(--ink-3); }
  .nodes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; position: relative; }
  .node { position: relative; background: transparent; border: 0; padding: 8px 6px 10px; text-align: center; cursor: pointer; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .node:hover { background: var(--surface-2); }
  .node[aria-pressed="true"] { background: var(--accent-soft); }
  .node + .node::before { content: ""; position: absolute; left: calc(-50% + 30px); right: calc(50% + 30px); top: 36px; height: 2px; background: var(--line-strong); }
  .node[data-status="done"] + .node::before { background: var(--done); }
  .ring { width: 56px; height: 56px; position: relative; display: grid; place-items: center; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .track { fill: none; stroke: var(--surface-2); stroke-width: 5; }
  .ring .fill { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
  .node[data-status="done"] .ring .fill { stroke: var(--done); }
  .node[data-status="todo"] .ring .fill { stroke: var(--todo); }
  .ring b { font-family: var(--font-mono); font-size: 13px; font-weight: 500; position: relative; }
  .node .nm { font-size: 13px; font-weight: 500; line-height: 1.3; color: var(--ink); text-wrap: balance; }
  .node .wk { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
  .node .st { margin-top: 2px; }
  .node .here { position: absolute; top: 2px; right: 6px; font-family: var(--font-mono); font-size: 10.5px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; }
  @media (max-width: 900px) {
    .nodes { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 8px; }
    .node + .node::before { display: none; }
  }
  @media (max-width: 520px) { .nodes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .weeks { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .weeks-head { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); margin-bottom: 8px; }
  .strip { display: grid; grid-template-columns: repeat(27, minmax(0, 1fr)); gap: 3px; }
  .cell { height: 22px; border-radius: 4px; background: var(--todo-soft); position: relative; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); display: grid; place-items: center; overflow: hidden; }
  .cell[data-alt="1"] { background: var(--surface-2); }
  .cell.past { background: var(--line); color: var(--ink-2); }
  .cell.past[data-alt="1"] { background: var(--line-strong); }
  .cell.now { background: var(--accent); color: var(--accent-ink); font-weight: 500; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .cell.phase-done { background: var(--done-soft); color: var(--done); }
  @media (max-width: 640px) { .cell { font-size: 0; height: 12px; } }

  /* ---------- tabs ---------- */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 26px; border-bottom: 1px solid var(--line-strong); }
  .tab { flex: 0 0 auto; background: transparent; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 12px; cursor: pointer; color: var(--ink-2); font-size: 14px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .tab .code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
  .tab[aria-selected="true"] .code { color: var(--accent); }
  .tab .mini { width: 8px; height: 8px; border-radius: 50%; background: var(--todo); }
  .tab .mini.done { background: var(--done); }
  .tab .mini.active { background: var(--active); }
  .tab.util { margin-left: 10px; padding-left: 16px; border-left: 1px solid var(--line); border-radius: 0; }
  @media (min-width: 1100px) { .tab.util { margin-left: auto; } }

  /* ---------- phase panel ---------- */
  .panel { margin-top: 22px; }
  .phead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 28px; align-items: start; }
  @media (max-width: 800px) { .phead { grid-template-columns: 1fr; } }
  .phead h2 { font-family: var(--font-display); font-size: 26px; font-weight: 700; margin: 0; line-height: 1.25; text-wrap: balance; }
  .phead h2 .code { font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--accent); margin-right: 10px; vertical-align: 3px; }
  .phead .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .phead .goal { margin: 12px 0 0; color: var(--ink-2); max-width: 68ch; }
  .pside { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 260px; }
  .pside .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--ink-2); }
  .pside .row + .row { margin-top: 8px; }
  .pside .row b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); }
  .pside input[type="date"] { font: inherit; font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .jd-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .jd-tag { font-size: 12px; padding: 3px 8px; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
  .jd-tag.must { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .cols { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 6fr); gap: 20px; margin-top: 22px; align-items: start; }
  @media (max-width: 960px) { .cols { grid-template-columns: 1fr; } }
  .col { display: grid; gap: 20px; min-width: 0; }
  .block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 14px; min-width: 0; }
  .block h3 { font-size: 15px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .block h3 .cnt { font-family: var(--font-mono); font-size: 12px; font-weight: 400; color: var(--ink-3); }
  .block .lead { margin: 0 0 10px; font-size: 13px; color: var(--ink-3); }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .item { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 6px 8px 4px; border-radius: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
  .item:hover { background: var(--surface-2); }
  .item input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--done); cursor: pointer; flex: none; }
  .item .t { font-size: 14px; line-height: 1.55; }
  .item.checked .t { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .item .hint { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
  .proj { border-left: 3px solid var(--accent); padding-left: 14px; margin-top: 6px; }
  .proj .pn { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0; }
  .proj .pn .code { font-family: var(--font-mono); font-size: 13px; color: var(--accent); margin-right: 8px; font-weight: 500; }
  .proj p { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
  .proj ol { margin: 10px 0 0; padding-left: 20px; font-size: 14px; color: var(--ink); display: grid; gap: 4px; }
  .proj ol li::marker { font-family: var(--font-mono); color: var(--ink-3); font-size: 12px; }

  .res { list-style: none; margin: 0; padding: 0; display: grid; }
  .res li { border-top: 1px solid var(--line); }
  .res li:first-child { border-top: 0; }
  .rrow { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 6px 9px 4px; border-radius: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .rrow:hover { background: var(--surface-2); }
  .rrow input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--done); cursor: pointer; }
  .rrow a { cursor: pointer; }
  .res .rt { display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: baseline; }
  .res .rt a { font-weight: 500; font-size: 14px; }
  .res li.checked .rt a { color: var(--ink-3); }
  .res .rn { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
  .chip { font-family: var(--font-mono); font-size: 10.5px; line-height: 1; padding: 3px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; letter-spacing: .02em; }
  .chip.zh { background: var(--active-soft); color: var(--active); }
  .chip.en { background: var(--accent-soft); color: var(--accent); }
  .chip.len { background: transparent; border: 1px solid var(--line); color: var(--ink-3); }
  .vid .ch { font-size: 12.5px; color: var(--ink-3); }
  .empty { font-size: 13.5px; color: var(--ink-3); margin: 0; padding: 6px 4px; }

  /* ---------- JD + rhythm views ---------- */
  .doc h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin: 0 0 6px; }
  .doc .intro { color: var(--ink-2); margin: 0 0 18px; max-width: 70ch; }
  .tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 640px; }
  th, td { text-align: left; padding: 11px 14px; border-top: 1px solid var(--line); vertical-align: top; }
  thead th { border-top: 0; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; background: var(--surface-2); }
  td.nowrap { white-space: nowrap; }
  .freq { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
  .freq.must { color: var(--accent); }
  .freq.new { color: var(--active); }
  .doc h3 { font-size: 16px; margin: 26px 0 8px; }
  .doc p { max-width: 70ch; }
  .principles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 800px) { .principles { grid-template-columns: 1fr; } }
  .principle { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .principle b { display: block; font-size: 15px; margin-bottom: 4px; }
  .principle p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
  .anti { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .anti li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
  .anti li b { color: var(--active); font-weight: 600; }
  pre { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; overflow-x: auto; margin: 0; color: var(--ink); }

  /* ---------- footer ---------- */
  .foot { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--ink-3); }
  .foot label { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
  .foot input[type="date"] { font: inherit; font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
  .btn-ghost:hover { border-color: var(--line-strong); color: var(--ink); }
  .btn-ghost.warn { border-color: var(--active); color: var(--active); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow">langGraph-learn · 6 个月学习计划</p>
      <h1>智能体研发 26 周</h1>
      <p class="sub">Python · <b>LangGraph</b> 主线 · 对标大厂 JD · 每周 8–12 小时 · 六个里程碑项目</p>
    </div>
    <div class="save" id="save" data-mode="init"><span class="dot"></span><span id="saveText">Checkpoint · 载入中</span></div>
  </header>

  <section class="stats" id="stats" aria-label="进度概览"></section>

  <section class="graph" aria-label="阶段状态图">
    <div class="graph-head">
      <h2>阶段状态图</h2>
      <p>点一个节点查看该阶段；环形是该阶段清单的完成率，边线在前一阶段全部完成后变绿。</p>
    </div>
    <div class="nodes" id="nodes"></div>
    <div class="weeks">
      <div class="weeks-head"><span id="weeksLeft">W0 → W26</span><span id="weeksRight"></span></div>
      <div class="strip" id="strip" aria-label="26 周进度条"></div>
    </div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="阶段"></nav>
  <main class="panel" id="panel"></main>

  <footer class="foot">
    <label>计划开始日期（第 1 周周一）<input type="date" id="startDate"></label>
    <span id="footNote">勾选即保存；同一账号在其他设备打开会同步。</span>
    <button class="btn-ghost" id="reset" type="button">重置全部进度</button>
  </footer>
</div>

<script>
(function () {
  'use strict';

  /* =========================== 数据 =========================== */
  // resources: [name, url, type, lang, note]; videos: [title, channel, url, lang, length, why]
  const PLAN = {
    start: '2026-09-14',
    phases: [
      {
        id: 'm0', code: 'M0', name: '准备周', short: '准备周', w0: 0, w1: 0, hours: 6,

    let week;

      if (writing || localVersion !== savedVersion) return; // 本地还有没写完的改动，云端快照一律不采纳
      const remote = normalize(snap.data());
      if (state.updatedAt && remote.updatedAt && remote.updatedAt < state.updatedAt) {
        // 本机比云端新（比如上次关页面前没写完）：把本机推上去
        localVersion++; flush();
        return;
      }
      if (!sameContent(remote, state)) {
        state = remote;
        saveLocal();
        syncDom(); // 就地更新勾选框，不重建页面
      } else if (remote.updatedAt) {
        state.updatedAt = remote.updatedAt;
      }
      setSaveMode('cloud', 'Checkpoint · 已同步到云端');
    }, () => {
      dbDoc = null;
      setSaveMode('local', 'Checkpoint · 云端不可用，已保存在本机');
    });
  }
  // 关页面前把还没写完的改动尽力送出去
  window.addEventListener('pagehide', () => { if (dbDoc && !writing && localVersion !== savedVersion) { clearTimeout(writeTimer); flush(); } });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && dbDoc && !writing && localVersion !== savedVersion) { clearTimeout(writeTimer); flush(); } });

  /* =========================== 渲染 =========================== */
  function renderStats() {
    const all = PLAN.phases.reduce((a, p) => { const pr = progress(p); a.done += pr.done; a.total += pr.total; return a; }, { done: 0, total: 0 });
    const dl = PLAN.phases.reduce((a, p) => { const pr = delivProgress(p); a.done += pr.done; a.total += pr.total; return a; }, { done: 0, total: 0 });
    const pct = all.total ? Math.round(all.done / all.total * 100) : 0;
    const cur = currentPhase();
    const wi = weekInfo();
    const expected = phaseForWeek(wi.week);
    const curIdx = PLAN.phases.indexOf(cur);
    const expIdx = expected ? PLAN.phases.indexOf(expected) : -1;

    let weekV, weekD;
    if (wi.week == null) { weekV = '—'; weekD = '先在页脚设置开始日期'; }
    else if (wi.week < 0) { weekV = '开始前'; weekD = '第 1 周从 ' + state.startDate + ' 起'; }
    else if (wi.week > 26) { weekV = 'W26+'; weekD = '26 周已过，进入自由复盘'; }
    else { weekV = 'W' + wi.week; weekD = weekRange(wi.week) + (wi.week === 0 ? ' · 准备周' : ''); }

    let pace = '', paceCls = '';
    if (expIdx >= 0 && wi.week >= 0) {
      if (curIdx > expIdx) { pace = '领先 ' + (curIdx - expIdx) + ' 个阶段'; paceCls = 'ahead'; }
      else if (curIdx === expIdx) { pace = '按计划'; paceCls = 'done'; }
      else { pace = '落后 ' + (expIdx - curIdx) + ' 个阶段'; paceCls = 'behind'; }
    } else if (wi.week != null && wi.week < 0) { pace = '尚未开始'; paceCls = ''; }

    const allDone = PLAN.phases.every(p => statusOf(p) === 'done');
    document.getElementById('stats').innerHTML = `
      <div class="stat">
        <p class="k">总进度</p>
        <p class="v">${pct}<small>%</small><small>· ${all.done} / ${all.total} 项</small></p>
        <div class="bar${allDone ? ' done' : ''}"><i style="width:${pct}%"></i></div>
      </div>
      <div class="stat">
        <p class="k">当前周</p>
        <p class="v">${esc(weekV)}<small>/ 26</small></p>
        <p class="d">${esc(weekD)}</p>
      </div>
      <div class="stat">
        <p class="k">当前阶段</p>
        <p class="v">${cur.code}<small>${esc(cur.short)}</small></p>
        <p class="d">${pace ? `<span class="pill ${paceCls}">${esc(pace)}</span>` : ''}${expected && expected.id !== cur.id ? `<span>按日历应在 ${expected.code}</span>` : ''}</p>
      </div>
      <div class="stat">
        <p class="k">输出成果</p>
        <p class="v">${dl.done}<small>/ ${dl.total} 项验收</small></p>
        <div class="bar${dl.done === dl.total ? ' done' : ''}"><i style="width:${dl.total ? dl.done / dl.total * 100 : 0}%"></i></div>
      </div>`;
  }

  function ring(pct, label, status) {
    const r = 24, c = 2 * Math.PI * r;
    return `<span class="ring"><svg viewBox="0 0 56 56" width="56" height="56" aria-hidden="true"><circle class="track" cx="28" cy="28" r="${r}"/><circle class="fill" cx="28" cy="28" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - pct)).toFixed(1)}"/></svg><b>${status === 'done' ? '✓' : label}</b></span>`;
  }

  function renderGraph() {
    const wi = weekInfo();
    const expected = phaseForWeek(wi.week);
    const sel = selectedPhaseId();
    document.getElementById('nodes').innerHTML = PLAN.phases.map(p => {
      const pr = progress(p); const st = statusOf(p);
      const stLabel = st === 'done' ? '已完成' : st === 'active' ? '进行中' : '未开始';
      return `<button class="node" type="button" data-phase="${p.id}" data-status="${st}" aria-pressed="${sel === p.id}" title="${esc(p.name)}">
        ${expected && expected.id === p.id ? '<span class="here">本周</span>' : ''}
        ${ring(pr.pct, Math.round(pr.pct * 100) + '%', st)}
        <span class="nm">${esc(p.short)}</span>
        <span class="wk">${p.w0 === p.w1 ? 'W' + p.w0 : 'W' + p.w0 + '–' + p.w1} · ${p.hours}h</span>
        <span class="pill ${st} st">${p.code} ${stLabel}</span>
      </button>`;
    }).join('');

    const cells = [];
    for (let w = 0; w <= 26; w++) {
      const p = phaseForWeek(w);
      const idx = p ? PLAN.phases.indexOf(p) : 0;
      const cls = ['cell'];
      if (p && statusOf(p) === 'done') cls.push('phase-done');
      else if (wi.week != null && wi.week >= 0 && w < wi.week) cls.push('past');
      if (wi.week === w) cls.push('now');
      cells.push(`<span class="${cls.join(' ')}" data-alt="${idx % 2}" title="W${w} · ${p ? esc(p.short) : ''}${weekRange(w) ? ' · ' + weekRange(w) : ''}">${w}</span>`);
    }
    document.getElementById('strip').innerHTML = cells.join('');
    const start = parseDate(state.startDate);
    let right = '';
    if (start) {
      const end = new Date(start); end.setDate(end.getDate() + 26 * 7 - 1);
      right = '第 1 周 ' + fmtDate(start) + ' → 第 26 周止 ' + fmtDate(end);
    }
    document.getElementById('weeksRight').textContent = right;
  }

  function selectedPhaseId() {
    if (activeTab === 'auto') return currentPhase().id;
    if (activeTab === 'jd' || activeTab === 'rhythm') return null;
    return activeTab;
  }

  function renderTabs() {
    const sel = activeTab === 'auto' ? currentPhase().id : activeTab;
    const items = PLAN.phases.map(p => `<button class="tab" role="tab" type="button" data-tab="${p.id}" aria-selected="${sel === p.id}"><span class="mini ${statusOf(p)}"></span><span class="code">${p.code}</span>${esc(p.short)}</button>`);
    items.push(`<button class="tab util" role="tab" type="button" data-tab="jd" aria-selected="${sel === 'jd'}">JD 基准</button>`);
    items.push(`<button class="tab" role="tab" type="button" data-tab="rhythm" aria-selected="${sel === 'rhythm'}">节奏与原则</button>`);

  function checkItem(id, text, hint) {
    const on = !!state.done[id];

  }

        </div>

          <div class="row"><span>清单完成率</span><b>${Math.round(pr.pct * 100)}%（${pr.done}/${pr.total}）</b></div>
          <div class="bar${st === 'done' ? ' done' : ''}" style="margin:8px 0 12px"><i style="width:${pr.pct * 100}%"></i></div>
          <div class="row"><span>验收成果</span><b>${dl.done} / ${dl.total}</b></div>
          <div class="row"><span>学习内容</span><b>${tDone} / ${p.topics.length}</b></div>

          <div class="row"><span>验收日期</span><input type="date" data-review="${p.id}" value="${esc(review)}"></div>
        </aside>

      <div class="cols">

            <ul class="list">${p.topics.map((t, i) => checkItem(p.id + '.t' + i, t[0], t[1])).join('')}</ul>

  function renderJd() {
    const rows = PLAN.jd.map(r => `<tr>
        <td class="nowrap">${r[5] ? '<b>' + esc(r[0]) + '</b>' : esc(r[0])}</td>
        <td><span class="freq ${r[2]}">${esc(r[1])}</span></td>

    document.getElementById('panel').innerHTML = `<div class="doc">
      <h2>JD 基准：大模型应用栈</h2>

      <div class="tbl-wrap"><table>

      <div class="tbl-wrap"><table>
        <thead><tr><th>时段</th><th>时长</th><th>内容</th></tr></thead>

          <tr><td class="nowrap">输入</td><td class="nowrap mono">2–3 h</td><td>文档 / 课程 / 论文，带着当周项目的具体问题读，不做无目标的通读。</td></tr>
          <tr><td class="nowrap">动手</td><td class="nowrap mono">5–7 h</td><td>项目代码，拆成两次 2.5–3.5 小时的深度时段，效果远好于每天 1 小时。</td></tr>

        </tbody>
      </table></div>
      <h3>学习日志模板（每周一条，放在 docs/journal/）</h3>
<pre>## Week N（日期）

- 一个数字：本周项目里能量化的一个结果
- 一个坑：踩了什么、怎么解决
- 一个问题：还没想明白的事（下周输入阶段优先解决）

      <h3>三条原则</h3>
      <div class="principles">
        <div class="principle"><b>项目驱动，评测先行</b><p>每个项目在写 Agent 之前先写 10 条测试用例。能不能说出"改了 X 之后指标从 71% 到 84%"，是档位的分水岭。</p></div>
        <div class="principle"><b>主线一条，广度靠对照</b><p>LangGraph 深挖到源码级；其余框架用"读设计 + 做一次同任务对照实验"覆盖，不平均用力。</p></div>
        <div class="principle"><b>用资深研发的肌肉记忆</b><p>状态机、契约设计、可观测、幂等重试、测试金字塔，直接迁移到 Agent 工程上。这是与应届 AI 候选人拉开差距的地方。</p></div>
      </div>
      <h3>七个反模式</h3>
      <ul class="anti">
        <li><b>课程囤积症。</b>只看不做。任何课程时间不超过当周项目时间的三分之一。</li>
        <li><b>框架跳跃。</b>同时学五个框架，每个都停在 quickstart。LangGraph 是唯一主线。</li>
        <li><b>没有评测的 Demo。</b>面试时说不出任何数字。先写用例再写 Agent。</li>

  function renderPanel() {
    const sel = activeTab === 'auto' ? currentPhase().id : activeTab;
    if (sel === 'jd') renderJd();
    else if (sel === 'rhythm') renderRhythm();
    else renderPhase(PLAN.phases.find(p => p.id === sel) || currentPhase());
  }

  function render() {
    renderStats();
    renderGraph();
    renderTabs();
    renderPanel();
    document.getElementById('startDate').value = state.startDate;
  }

  function visiblePhase() {
    const sel = activeTab === 'auto' ? currentPhase().id : activeTab;
    return PLAN.phases.find(p => p.id === sel) || null;
  }

  // 只刷新当前阶段面板里的计数、进度条和状态标签，不重建清单
  function refreshCounters(p) {
    const aside = document.querySelector('.pside');
    if (!aside || !document.querySelector('.phead h2 .code') || document.querySelector('.phead h2 .code').textContent !== p.code) return;
    const pr = progress(p); const dl = delivProgress(p);
    const tDone = p.topics.filter((_, i) => state.done[p.id + '.t' + i]).length;
    const rDone = p.resources.filter((_, i) => state.done[p.id + '.r' + i]).length;
    const vDone = p.videos.filter((_, i) => state.done[p.id + '.v' + i]).length;
    const bs = aside.querySelectorAll('.row b');
    if (bs.length >= 4) {
      bs[0].textContent = Math.round(pr.pct * 100) + '%（' + pr.done + '/' + pr.total + '）';
      bs[1].textContent = dl.done + ' / ' + dl.total;
      bs[2].textContent = tDone + ' / ' + p.topics.length;
      bs[3].textContent = rDone + ' / ' + p.resources.length + ' · ' + vDone + ' / ' + p.videos.length;
    }
    const bar = aside.querySelector('.bar');
    if (bar) { bar.classList.toggle('done', statusOf(p) === 'done'); bar.querySelector('i').style.width = (pr.pct * 100) + '%'; }
    const cnts = document.querySelectorAll('.block h3 .cnt');
    if (cnts.length === 4) { cnts[0].textContent = tDone + ' / ' + p.topics.length; cnts[1].textContent = dl.done + ' / ' + dl.total; cnts[2].textContent = rDone + ' / ' + p.resources.length; cnts[3].textContent = vDone + ' / ' + p.videos.length; }
    const pill = document.querySelector('.phead .meta .pill'); const st = statusOf(p);
    if (pill) { pill.className = 'pill ' + st; pill.textContent = st === 'done' ? '已完成' : st === 'active' ? '进行中' : '未开始'; }
  }

  // 云端状态到达时就地更新页面：勾选框、日期、统计，不销毁正在操作的 DOM
  function syncDom() {
    document.querySelectorAll('input[type="checkbox"][data-id]').forEach(cb => {
      const on = !!state.done[cb.dataset.id];
      if (cb.checked !== on) cb.checked = on;
      const wrap = cb.closest('.item, li');
      if (wrap) wrap.classList.toggle('checked', on);
    });
    document.querySelectorAll('input[data-review]').forEach(i => { i.value = state.reviewed[i.dataset.review] || ''; });
    const sd = document.getElementById('startDate'); if (sd) sd.value = state.startDate;
    renderStats(); renderGraph(); renderTabs();
    const p = visiblePhase(); if (p) refreshCounters(p);
  }

  /* =========================== 事件 =========================== */
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('input[type="checkbox"][data-id]')) {
      const id = t.dataset.id;
      const p = PLAN.phases.find(x => id.startsWith(x.id + '.'));
      // 一旦开始勾选，就把标签固定在这个阶段，完成后不会自动跳到下一阶段
      if (activeTab === 'auto' && p) { activeTab = p.id; rememberTab(); }
      if (t.checked) state.done[id] = true; else delete state.done[id];
      const wrap = t.closest('.item, li');
      if (wrap) wrap.classList.toggle('checked', t.checked);
      touch();
      renderStats(); renderGraph(); renderTabs();
      if (p) refreshCounters(p);
    } else if (t.matches('input[data-review]')) {
      const pid = t.dataset.review;
      if (t.value) state.reviewed[pid] = t.value; else delete state.reviewed[pid];
      touch();
    } else if (t.id === 'startDate') {
      if (parseDate(t.value)) { state.startDate = t.value; touch(); renderStats(); renderGraph(); }
    }
  });

  document.addEventListener('click', e => {
    const node = e.target.closest('.node[data-phase]');
    if (node) { activeTab = node.dataset.phase; rememberTab(); renderGraph(); renderTabs(); renderPanel(); document.getElementById('tabs').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const tab = e.target.closest('.tab[data-tab]');
    if (tab) { activeTab = tab.dataset.tab; rememberTab(); renderGraph(); renderTabs(); renderPanel(); return; }
    if (e.target.id === 'reset') {
      const btn = e.target;
      if (btn.dataset.armed === '1') {
        state = { done: {}, startDate: state.startDate, reviewed: {}, updatedAt: '' };
        touch(); render();
        btn.dataset.armed = ''; btn.textContent = '重置全部进度'; btn.classList.remove('warn');
      } else {
        btn.dataset.armed = '1'; btn.textContent = '再点一次确认清空所有勾选'; btn.classList.add('warn');
        setTimeout(() => { btn.dataset.armed = ''; btn.textContent = '重置全部进度'; btn.classList.remove('warn'); }, 4000);
      }
    }
  });

  function rememberTab() { try { localStorage.setItem(LS_TAB, activeTab); } catch (e) { /* ignore */ } }

  /* =========================== 启动 =========================== */
  const local = loadLocal();
  if (local) state = local;
  try { const t = localStorage.getItem(LS_TAB); if (t && (t === 'jd' || t === 'rhythm' || PLAN.phases.some(p => p.id === t))) activeTab = t; } catch (e) { /* ignore */ }
  render();
  initDb();
})();
</script>
</body>
</html>
